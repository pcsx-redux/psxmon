[package]
name = "psxmon"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Host tool for the PS1 debug monitor: load, run, PCDRV, memory access"
repository = "https://github.com/pcsx-redux/psxmon"

[lib]
path = "src/lib.rs"

[[bin]]
name = "psxmon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
gdbstub = "0.7"
gdbstub_arch = "0.3"
miniz_oxide = "0.9.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "io-util", "io-std", "sync", "net"] }
serialport = { version = "4.10", default-features = false }

# ATCONS port I/O (ioperm).
[target.'cfg(all(target_os = "linux", any(target_arch = "x86", target_arch = "x86_64")))'.dependencies]
libc = "0.2"

[dev-dependencies]
lz4_flex = "0.11"
tempfile = "3"

[lints.clippy]
all = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
mod_module_files = "deny"
self_named_module_files = "allow"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
pub_without_shorthand = "deny"
unwrap_used = "deny"
expect_used = "deny"
pub_use = "allow"
pub_with_shorthand = "allow"
arbitrary_source_item_ordering = "allow"
implicit_return = "allow"
single_call_fn = "allow"
question_mark_used = "allow"
print_stdout = "allow"
use_debug = "allow"
todo = "allow"
shadow_same = "allow"
shadow_reuse = "allow"
shadow_unrelated = "allow"
allow_attributes = "allow"
missing_errors_doc = "allow"
